<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>叶词 · 小清新背单词</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --mint:#8fd9c0; --mint-d:#5fb79a; --mint-dd:#3f9b7d;
    --mint-l:#eaf8f3; --line:#e2f0ea;
    --ink:#33544b; --ink-2:#7c9c92; --ink-3:#a9c2ba;
    --peach:#ffb4a2; --sun:#ffd79a; --rose:#ffc4bb;
    --shadow:0 8px 30px rgba(95,183,154,.13);
  }
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink); background:#f4fbf8; min-height:100vh;
    background-image:
      radial-gradient(circle at 8% 4%, #e2f6ee 0, transparent 38%),
      radial-gradient(circle at 92% 0%, #e8f4ff 0, transparent 34%),
      radial-gradient(circle at 50% 100%, #fdf5ec 0, transparent 40%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:#cdeee2}

  /* ============ 顶栏 ============ */
  .topbar{
    height:64px; display:flex; align-items:center; justify-content:space-between;
    padding:0 26px; position:sticky; top:0; z-index:40;
    background:rgba(255,255,255,.72); backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;color:var(--mint-dd);letter-spacing:.5px;cursor:pointer}
  .brand .logo{
    width:30px;height:30px;border-radius:10px;display:grid;place-items:center;
    background:linear-gradient(135deg,#a8e6cf,#6ec6a8);color:#fff;font-size:16px;
    box-shadow:0 4px 12px rgba(95,183,154,.35);
  }
  .topnav{display:flex;gap:6px}
  .topnav button{
    border:none;background:transparent;font-family:inherit;font-size:14px;font-weight:600;
    color:var(--ink-2);padding:8px 16px;border-radius:12px;cursor:pointer;transition:.18s;
  }
  .topnav button:hover{background:var(--mint-l);color:var(--mint-dd)}
  .topnav button.active{background:var(--mint-l);color:var(--mint-dd)}

  /* ============ 通用 ============ */
  #main{max-width:1000px;margin:0 auto;padding:30px 22px 70px}
  .btn{
    border:none;border-radius:14px;padding:11px 20px;font-size:14px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:.18s;white-space:nowrap;
  }
  .btn.sm{padding:8px 14px;font-size:13px;border-radius:11px}
  .btn.primary{background:linear-gradient(135deg,#9ee3ca,#5fb79a);color:#fff;box-shadow:0 6px 18px rgba(95,183,154,.3)}
  .btn.primary:hover{transform:translateY(-1px);box-shadow:0 9px 22px rgba(95,183,154,.38)}
  .btn.ghost{background:var(--mint-l);color:var(--mint-dd)}
  .btn.ghost:hover{background:#ddf3ea}
  .btn.danger{background:#fff1ee;color:#e07a63}
  .btn.danger:hover{background:#ffe6e1}
  .btn:active{transform:scale(.97)}
  .pill{
    display:inline-block;background:var(--mint-l);color:var(--mint-dd);
    font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;
  }
  .muted{color:var(--ink-3);font-size:13px}
  .sub{color:var(--ink-2);font-size:13.5px;margin-top:6px;line-height:1.6}

  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
  .page-head h1{font-size:26px;letter-spacing:.5px;font-weight:800}
  .head-actions{display:flex;gap:10px;flex-wrap:wrap}

  /* ============ 词表卡片 ============ */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
  .card{
    background:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow);
    border:1px solid rgba(226,240,234,.9);transition:.22s;position:relative;overflow:hidden;
  }
  .card::after{
    content:"";position:absolute;right:-32px;top:-32px;width:90px;height:90px;border-radius:50%;
    background:linear-gradient(135deg,#eafaf3,#dff3ff);opacity:.75;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(95,183,154,.2)}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1}
  .card-head h3{font-size:17px;font-weight:800;word-break:break-all;line-height:1.35}
  .card .muted{margin:9px 0 16px;position:relative;z-index:1}
  .card-actions{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}

  .empty{
    grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--ink-3);
    background:#fff;border-radius:24px;border:2px dashed var(--line);line-height:2;
    font-size:14.5px;
  }

  /* ============ 详情页 ============ */
  .back-line{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .groups{display:flex;flex-direction:column;gap:16px}
  .group{
    background:#fff;border-radius:22px;padding:18px 20px;box-shadow:var(--shadow);
    border:1px solid rgba(226,240,234,.9);
  }
  .group-head{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:wrap}
  .group-head .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,#9ee3ca,#5fb79a);flex:none}
  .group-title{font-weight:800;font-size:14.5px;color:var(--mint-dd)}
  .group-tag{
    font-size:12px;font-weight:700;color:#b98a3c;background:#fff6e6;
    padding:3px 10px;border-radius:99px;
  }
  .word-list{display:flex;flex-direction:column;gap:2px;border-left:2px solid #eef7f3;margin-left:4px;padding-left:16px}
  .word-item{padding:9px 0;border-bottom:1px dashed #f0f7f4}
  .word-item:last-child{border-bottom:none}
  .w-term{font-size:16px;font-weight:700;letter-spacing:.3px}
  .w-ph{font-size:12.5px;color:var(--ink-3);font-weight:500;margin-left:7px}
  .w-mean{font-size:13.5px;color:var(--ink-2);margin-top:4px;line-height:1.6}

  /* ============ 学习页 ============ */
  .study{display:flex;flex-direction:column;min-height:calc(100vh - 150px)}
  .study-top{display:flex;align-items:center;gap:14px;padding:4px 2px 0}
  .icon-btn{
    width:38px;height:38px;border-radius:50%;border:none;background:#fff;color:var(--ink-2);
    font-size:16px;cursor:pointer;box-shadow:0 4px 14px rgba(95,183,154,.15);transition:.18s;flex:none;
  }
  .icon-btn:hover{background:#fff;color:var(--mint-dd);transform:rotate(90deg)}
  .progress{flex:1;height:8px;background:#e8f5f0;border-radius:99px;overflow:hidden}
  .progress .bar{height:100%;background:linear-gradient(90deg,#a8e6cf,#5fb79a);border-radius:99px;transition:width .35s ease}
  .counter{font-size:13px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}

  .study-card{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#fff;border-radius:30px;box-shadow:0 12px 44px rgba(95,183,154,.14);
    padding:44px 26px;margin:18px 0;position:relative;cursor:pointer;min-height:400px;
    border:1px solid rgba(226,240,234,.9);animation:fadeUp .32s ease;overflow:hidden;
  }
  .study-card::before{
    content:"";position:absolute;width:260px;height:260px;border-radius:50%;left:-90px;bottom:-110px;
    background:radial-gradient(circle,#f0fbf7,transparent 70%);
  }
  .study-card::after{
    content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-80px;top:-90px;
    background:radial-gradient(circle,#eff8ff,transparent 70%);
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .word-block{text-align:center;position:relative;z-index:2}
  .the-word{font-weight:800;color:#2f5b4e;letter-spacing:.6px;line-height:1.25;word-break:break-word;font-family:"Georgia","Times New Roman",serif}
  .phonetic{margin-top:12px;font-size:15px;color:var(--ink-3);letter-spacing:.5px}
  .speak-btn{
    margin-top:16px;width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
    background:var(--mint-l);font-size:17px;transition:.18s;box-shadow:0 4px 14px rgba(95,183,154,.16);
  }
  .speak-btn:hover{background:#d9f2e8;transform:scale(1.07)}
  .speak-btn:active{transform:scale(.94)}

  .tap-hint{
    position:absolute;bottom:34px;left:0;right:0;text-align:center;
    font-size:13px;color:var(--ink-3);letter-spacing:.5px;z-index:2;
    animation:breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}

  .reveal{
    width:100%;max-width:560px;margin-top:30px;text-align:center;
    opacity:0;transform:translateY(12px);transition:.32s ease;position:relative;z-index:2;
  }
  .reveal.show{opacity:1;transform:none}
  .meaning{font-size:19px;font-weight:700;color:#3f7364;line-height:1.7;letter-spacing:.3px}
  .mates{
    margin-top:22px;padding-top:18px;border-top:1px dashed #e8f3ee;
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;
  }
  .mates-label{font-size:12px;color:var(--ink-3);font-weight:700;letter-spacing:.5px;margin-right:2px}
  .chip{
    background:#f1faf6;color:#519c83;font-size:13px;font-weight:600;
    padding:5px 12px;border-radius:99px;border:1px solid #e2f3ec;
  }

  .study-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .act-btn{
    padding:17px 8px;border-radius:18px;border:none;font-size:16px;font-weight:800;
    cursor:pointer;font-family:inherit;transition:.16s;letter-spacing:.5px;
  }
  .act-btn.unknown{background:#fff1ee;color:#e07a63}
  .act-btn.unknown:hover{background:#ffe4de}
  .act-btn.fuzzy{background:#fff8e9;color:#d9a33c}
  .act-btn.fuzzy:hover{background:#fff2d6}
  .act-btn.known{background:#e8f9f1;color:#3f9b7d}
  .act-btn.known:hover{background:#daf4e8}
  .act-btn:active{transform:scale(.97)}

  /* ============ 结果页 ============ */
  .done{text-align:center;padding:60px 20px;background:#fff;border-radius:28px;box-shadow:var(--shadow);margin-top:20px}
  .done-emoji{font-size:52px;margin-bottom:14px}
  .done h1{font-size:24px;margin-bottom:28px;font-weight:800}
  .done-stats{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-bottom:34px}
  .stat{background:#f8fdfb;border-radius:18px;padding:18px 30px;font-size:13px;color:var(--ink-2);font-weight:600;min-width:96px}
  .stat span{display:block;font-size:26px;font-weight:800;margin-bottom:4px}
  .stat.known span{color:#3f9b7d}
  .stat.fuzzy span{color:#d9a33c}
  .stat.unknown span{color:#e07a63}
  .done-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

  /* ============ 弹窗 ============ */
  .mask{
    position:fixed;inset:0;background:rgba(51,84,75,.28);backdrop-filter:blur(4px);
    display:grid;place-items:center;z-index:100;padding:20px;animation:fadeIn .2s ease;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{
    background:#fff;border-radius:26px;padding:28px;width:100%;max-width:560px;
    max-height:86vh;overflow-y:auto;box-shadow:0 24px 70px rgba(51,84,75,.22);
    animation:pop .24s cubic-bezier(.2,1.1,.4,1);
  }
  @keyframes pop{from{opacity:0;transform:scale(.95) translateY(12px)}to{opacity:1;transform:none}}
  .modal h2{font-size:20px;margin-bottom:6px;font-weight:800}
  .field-label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin:18px 0 8px}
  .input{
    width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 15px;
    font-family:inherit;font-size:14px;color:var(--ink);background:#fbfefd;transition:.18s;outline:none;
  }
  .input:focus{border-color:var(--mint);background:#fff;box-shadow:0 0 0 4px rgba(143,217,192,.16)}
  textarea.input{min-height:190px;resize:vertical;line-height:1.85;font-family:"SF Mono",Consolas,Monaco,monospace;font-size:13.5px}
  .hint{font-size:12.5px;color:var(--ink-3);margin-top:10px;line-height:1.8}
  .hint code{background:#f2faf6;color:#4f9c84;padding:1px 6px;border-radius:5px;font-size:12px}
  .modal-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:24px}
  .preview{
    list-style:none;margin-top:16px;background:#f9fdfb;border-radius:16px;padding:14px 18px;
    max-height:230px;overflow-y:auto;font-size:13.5px;line-height:2;
    border:1px solid var(--line);
  }
  .preview b{color:#2f5b4e;font-weight:700}
  .preview .muted{margin-left:8px}

  /* ============ toast ============ */
  .toast{
    position:fixed;left:50%;bottom:44px;transform:translate(-50%,16px);
    background:rgba(51,84,75,.92);color:#fff;font-size:13.5px;font-weight:600;
    padding:12px 22px;border-radius:14px;opacity:0;transition:.28s;z-index:200;pointer-events:none;
    box-shadow:0 10px 30px rgba(51,84,75,.28);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media(max-width:640px){
    #main{padding:22px 14px 60px}
    .topbar{padding:0 14px}
    .page-head h1{font-size:21px}
    .study-card{padding:34px 16px;min-height:330px}
    .meaning{font-size:17px}
    .act-btn{font-size:14.5px;padding:15px 4px}
    .study-actions{gap:9px}
    .modal{padding:22px;border-radius:22px}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand" id="brand"><span class="logo">🌿</span>叶词</div>
  <nav class="topnav">
    <button id="navHome" class="active">我的词表</button>
  </nav>
</header>

<main id="main"></main>
<div id="modalRoot"></div>

<script>
/* ============================================================
 *  0. 工具
 * ============================================================ */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 320); }, 2200);
}

function speak(text){
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.88; u.pitch = 1;
  speechSynthesis.speak(u);
}

/* ============================================================
 *  1. 存储
 * ============================================================ */
const STORE_KEY = 'leafword.lists.v1';
const PROGRESS_KEY = 'leafword.progress.v1';

let LISTS = (() => {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch (e) { return []; }
})();
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(LISTS)); }
function getList(id){ return LISTS.find(l => l.id === id); }

// 学习进度保存
function saveProgress() {
  if (!session) return;
  const data = {
    listId: session.listId,
    queueIds: session.queue.map(w => w.id),
    idx: session.idx,
    results: session.results
  };
  localStorage.setItem(PROGRESS_KEY, JSON.stringify(data));
}
function clearProgress() {
  localStorage.removeItem(PROGRESS_KEY);
}
function getSavedProgress(listId) {
  try {
    const data = JSON.parse(localStorage.getItem(PROGRESS_KEY));
    if (data && data.listId === listId && data.idx < data.queueIds.length) {
      return data;
    }
  } catch(e) {}
  return null;
}

/* ============================================================
 *  2. 文本解析（单词 / 词组 / 固定搭配）
 * ============================================================ */
const PHONETIC_CHARS = /[a-zA-Zəɪʊɔæɑɒʌɜθðʃʒŋˈˌː]/;

function parseLine(line){
  let phonetic = '';
  let rest = line;

  const phm = line.match(/[\/\[]([^\/\]]{1,45})[\/\]]/);
  if (phm && PHONETIC_CHARS.test(phm[1]) && !/[\u4e00-\u9fff]/.test(phm[1])) {
    phonetic = phm[0];
    rest = (line.slice(0, phm.index) + ' ' + line.slice(phm.index + phm[0].length)).trim();
  }

  let parts = null;

  if (rest.includes('\t'))                  parts = rest.split('\t');
  else if (/[|｜]/.test(rest))              parts = rest.split(/[|｜]/);
  else if (/[;；]/.test(rest))              parts = rest.split(/[;；]/);
  else {
    const m = rest.match(/^([A-Za-z0-9'’\-\.\s\/()]+?)\s*[,，]\s*([\s\S]+)$/);
    if (m) parts = [m[1], m[2]];
  }

  if (!parts) {
    const m = rest.match(/^([A-Za-z0-9][A-Za-z0-9'’\-\.\s\/()]*?)\s+([\u4e00-\u9fff][\s\S]*)$/);
    if (m) parts = [m[1], m[2]];
    else parts = [rest];
  }

  parts = parts.map(s => s.trim()).filter(Boolean);
  if (!parts.length) return null;

  const term = parts[0].trim();
  if (!term) return null;

  let meaning = parts.slice(1).join('，').trim();

  return { term, phonetic, meaning };
}

function parseText(text){
  const out = [];
  const seen = new Set();
  text.split(/\r?\n/).forEach(raw => {
    const line = raw.trim();
    if (!line) return;
    if (/^(#|\/\/)/.test(line)) return;
    if (!out.length && /^(word|单词|词汇|term|english)\b/i.test(line) && !/[\u4e00-\u9fff]/.test(line)) return;
    const item = parseLine(line);
    if (!item || !item.term) return;
    const key = item.term.toLowerCase();
    if (seen.has(key)) return;
    seen.add(key);
    out.push(item);
  });
  return out;
}

/* ============================================================
 *  3. 语义归类引擎
 * ============================================================ */
const CN_TAGS = {
  joy:       { label:'高兴 / 快乐', words:['高兴','快乐','开心','愉快','喜悦','欢乐','欣喜','幸福','欢快','愉悦'] },
  sad:       { label:'悲伤 / 难过', words:['悲伤','难过','伤心','悲哀','沮丧','消沉','忧郁','痛苦','凄凉','悲痛'] },
  angry:     { label:'生气 / 愤怒', words:['生气','愤怒','恼火','发怒','暴怒','气愤','怒火'] },
  fear:      { label:'害怕 / 恐惧', words:['害怕','恐惧','惊恐','畏惧','惊吓','恐怖','惧怕'] },
  brave:     { label:'勇敢', words:['勇敢','大胆','无畏','英勇','胆大'] },
  big:       { label:'大 / 巨大', words:['大的','巨大','庞大','宏大','广阔','广大'] },
  small:     { label:'小 / 微小', words:['小的','微小','细小','渺小','少量','细微'] },
  fast:      { label:'快 / 迅速', words:['快的','迅速','快速','急速','敏捷','飞快'] },
  slow:      { label:'慢 / 缓慢', words:['慢的','缓慢','迟缓','拖延'] },
  beauty:    { label:'美丽', words:['美丽','漂亮','好看','优美','秀丽','迷人','俊美'] },
  ugly:      { label:'丑陋', words:['丑陋','难看','丑恶','丑'] },
  smart:     { label:'聪明', words:['聪明','智慧','机智','明智','聪慧','机灵'] },
  stupid:    { label:'愚蠢', words:['愚蠢','笨','傻','愚笨','糊涂'] },
  important: { label:'重要', words:['重要','关键','重大','要紧','必要','至关重要'] },
  easy:      { label:'容易', words:['容易','简单','轻易','轻松','不费力'] },
  hard:      { label:'困难', words:['困难','艰难','辛苦','费劲','艰巨'] },
  begin:     { label:'开始', words:['开始','着手','启动','开端','起始','开幕'] },
  endv:      { label:'结束', words:['结束','终止','完结','终结','收尾'] },
  inc:       { label:'增加 / 提高', words:['增加','提高','增长','上升','增强','扩大','加剧'] },
  dec:       { label:'减少 / 降低', words:['减少','降低','下降','减弱','缩小','削减'] },
  help:      { label:'帮助', words:['帮助','协助','援助','支持','帮忙','救助'] },
  show:      { label:'展示 / 显示', words:['展示','显示','表明','显露','表现','揭示','展出'] },

const CN_INDEX = {};
for (const [tag, def] of Object.entries(CN_TAGS)) {
  def.words.forEach(w => { (CN_INDEX[w] = CN_INDEX[w] || []).push(tag); });
}

function getCnTags(meaning){
  if (!meaning) return [];
  const set = new Set();
  for (const w in CN_INDEX) {
    if (meaning.includes(w)) CN_INDEX[w].forEach(t => set.add(t));
  }
  return [...set].slice(0, 3);
}

function synKey(en){
  if (!en) return null;
  const base = en.toLowerCase().replace(/[^a-z' -]/g, '').trim();
  if (!base) return null;
  const cands = [base];
  const first = base.split(' ')[0];
  if (first !== base) cands.push(first);
  const t = first;
  if (t.endsWith('ies')) cands.push(t.slice(0, -3) + 'y');
  if (t.endsWith('es'))  cands.push(t.slice(0, -2));
  if (t.endsWith('s'))   cands.push(t.slice(0, -1));
  if (t.endsWith('ing')) { cands.push(t.slice(0, -3), t.slice(0, -3) + 'e'); }
  if (t.endsWith('ed'))  { cands.push(t.slice(0, -2), t.slice(0, -1)); }
  if (t.endsWith('ly'))  { cands.push(t.slice(0, -2)); }
  if (t.endsWith('er'))  { cands.push(t.slice(0, -2), t.slice(0, -1)); }
  if (t.endsWith('est')) { cands.push(t.slice(0, -3)); }
  for (const c of cands) if (c in EN_INDEX) return EN_INDEX[c];
  return null;
}

function commonPrefixLen(a, b){
  let i = 0; const m = Math.min(a.length, b.length);
  while (i < m && a[i] === b[i]) i++;
  return i;
}

function similarity(a, b){
  let s = 0;
  if (a.syn !== null && a.syn === b.syn) s += 3;
  if (a.tags.some(t => b.tags.includes(t))) s += 2;
  if (commonPrefixLen(a.en, b.en) >= 4) s += 2;
  return s;
}

function buildGroups(words){
  const n = words.length;
  if (!n) return [];

  const parent = Array.from({ length: n }, (_, i) => i);
  const find = i => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
  const union = (a, b) => { a = find(a); b = find(b); if (a !== b) parent[b] = a; };

  const info = words.map(w => {
    const en = (w.term || '').toLowerCase().replace(/[^a-z' -]/g, '').trim();
    return { en, syn: synKey(en), tags: getCnTags(w.meaning) };
  });

  for (let i = 0; i < n; i++)
    for (let j = i + 1; j < n; j++)
      if (similarity(info[i], info[j]) >= 2) union(i, j);

  const bucket = new Map();
  for (let i = 0; i < n; i++) {
    const r = find(i);
    if (!bucket.has(r)) bucket.set(r, []);
    bucket.get(r).push(i);
  }

  const groups = [];
  bucket.forEach(idxArr => {
    let label = '';
    if (idxArr.length > 1) {
      const counts = {};
      idxArr.forEach(i => info[i].tags.forEach(t => { counts[t] = (counts[t] || 0) + 1; }));
      const best = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
      if (best && best[1] > 1) label = (CN_TAGS[best[0]] && CN_TAGS[best[0]].label) || '';
    }
    groups.push({ words: idxArr.map(i => words[i]), label });
  });

  return groups;
}

/* ============================================================
 *  4. 全局状态
 * ============================================================ */
const state = { view: 'home', currentListId: null };
let session = null;

/* ============================================================
 *  5. 路由渲染
 * ============================================================ */
function render(){
  const main = $('#main');
  main.innerHTML = '';
  if (state.view === 'home')        renderHome(main);
  else if (state.view === 'detail') renderDetail(main);
  else if (state.view === 'study')  renderStudy(main);
  else if (state.view === 'done')   renderDone(main);
  window.scrollTo({ top: 0 });
}

/* ---------- 5.1 首页 ---------- */
function renderHome(main){
  main.innerHTML = `
    <div class="page-head">
      <div>
        <h1>我的词表</h1>
        <p class="sub">自建或上传单词、词组与固定搭配，系统会自动把意思相近的内容排在一起 🌿</p>
      </div>
      <div class="head-actions">
        <button class="btn ghost" id="btnUpload">⬆ 上传词表</button>
        <button class="btn primary" id="btnCreate">＋ 新建词表</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  `;

  main.querySelector('#btnCreate').onclick = () => openCreateModal();
  main.querySelector('#btnUpload').onclick = pickFile;

  const grid = main.querySelector('#grid');

  if (!LISTS.length) {
    grid.innerHTML = `<div class="empty">还没有词表哦～<br>点击「新建词表」或「上传词表」开始你的第一份词汇吧 🌱</div>`;
    return;
  }

  LISTS.forEach(list => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-head">
        <h3>${esc(list.name)}</h3>
        <span class="pill">${list.words.length} 条</span>
      </div>
      <p class="muted">${new Date(list.createdAt).toLocaleDateString('zh-CN')} 创建</p>
      <div class="card-actions">
        <button class="btn primary sm" data-act="study">开始背诵</button>
        <button class="btn ghost sm" data-act="open">查看</button>
        <button class="btn danger sm" data-act="del">删除</button>
      </div>`;
    card.querySelector('[data-act="study"]').onclick = () => startStudy(list.id);
    card.querySelector('[data-act="open"]').onclick  = () => { state.view = 'detail'; state.currentListId = list.id; render(); };
    card.querySelector('[data-act="del"]').onclick   = () => {
      if (confirm(`确定删除词表「${list.name}」吗？`)) {
        LISTS = LISTS.filter(l => l.id !== list.id);
        save(); render(); toast('已删除');
      }
    };
    grid.appendChild(card);
  });
}

/* ---------- 5.2 详情页 ---------- */
function renderDetail(main){
  const list = getList(state.currentListId);
  if (!list) { state.view = 'home'; render(); return; }

  const groups = buildGroups(list.words);

  main.innerHTML = `
    <div class="page-head">
      <div>
        <div class="back-line">
          <button class="btn ghost sm" id="back">← 返回</button>
          <h1>${esc(list.name)}</h1>
        </div>
        <p class="sub">共 ${list.words.length} 条内容 · 已自动整理为 ${groups.length} 个词群</p>
      </div>
      <button class="btn primary" id="studyNow">开始背诵</button>
    </div>
    <div class="groups" id="groups"></div>
  `;

  main.querySelector('#back').onclick = () => { state.view = 'home'; render(); };
  main.querySelector('#studyNow').onclick = () => startStudy(list.id);

  const wrap = main.querySelector('#groups');
  groups.forEach((g, i) => {
    const sec = document.createElement('section');
    sec.className = 'group';
    sec.innerHTML = `
      <div class="group-head">
        <span class="dot"></span>
        <span class="group-title">词群 ${i + 1}</span>
        ${g.label ? `<span class="group-tag">${esc(g.label)}</span>` : ''}
        <span class="pill">${g.words.length} 条</span>
      </div>
      <div class="word-list">
        ${g.words.map(w => `
          <div class="word-item">
            <div class="w-term">${esc(w.term)}${w.phonetic ? `<span class="w-ph">${esc(w.phonetic)}</span>` : ''}</div>
            ${w.meaning ? `<div class="w-mean">${esc(w.meaning)}</div>` : ''}
          </div>`).join('')}
      </div>`;
    wrap.appendChild(sec);
  });
}

/* ---------- 5.3 学习页 ---------- */
function startStudy(listId, onlyIds){
  const list = getList(listId);
  if (!list || !list.words.length) { toast('词表是空的哦'); return; }

  // 如果不是复习模式，检查断点续背
  if (!onlyIds || !onlyIds.length) {
    const saved = getSavedProgress(listId);
    if (saved) {
      openModal(`
        <h2>继续上次学习？</h2>
        <p class="sub">检测到你上次背到第 ${saved.idx + 1} / ${saved.queueIds.length} 个，是否继续？</p>
        <div class="modal-actions">
          <button class="btn ghost" id="restart">重新开始</button>
          <button class="btn primary" id="continue">继续背诵</button>
        </div>
      `, m => {
        m.querySelector('#restart').onclick = () => {
          clearProgress();
          closeModal();
          doStartStudy(listId, list.words, null);
        };
        m.querySelector('#continue').onclick = () => {
          closeModal();
          const wordMap = {};
          list.words.forEach(w => wordMap[w.id] = w);
          const restoredWords = saved.queueIds.map(id => wordMap[id]).filter(Boolean);
          doStartStudy(listId, restoredWords, saved);
        };
      });
      return;
    }
  }

  doStartStudy(listId, list.words, null, onlyIds);
}

function doStartStudy(listId, words, savedProgress, onlyIds) {
  if (onlyIds && onlyIds.length) words = words.filter(w => onlyIds.includes(w.id));
  if (!words.length) { toast('没有需要复习的单词啦'); return; }

  const groups = buildGroups(words);
  const queue = [];
  const groupOf = {};
  groups.forEach(g => {
    g.words.forEach(w => {
      queue.push(w);
      groupOf[w.id] = g.words.filter(x => x.id !== w.id);
    });
  });

  let idx = 0;
  let results = {};

  if (savedProgress) {
    idx = savedProgress.idx;
    results = savedProgress.results;
  }

  session = { listId, queue, idx, revealed: false, results, groupOf };
  state.view = 'study';
  saveProgress();
  render();
}

function renderStudy(main){
  const s = session;
  if (!s || s.idx >= s.queue.length) { finishStudy(); return; }

  const w = s.queue[s.idx];
  const total = s.queue.length;
  const len = (w.term || '').length;
  const fs = len > 24 ? 22 : len > 16 ? 28 : len > 10 ? 36 : 46;
  const mates = s.groupOf[w.id] || [];

  main.innerHTML = `
    <div class="study">
      <div class="study-top">
        <button class="icon-btn" id="exit">✕</button>
        <div class="progress"><div class="bar" style="width:${(s.idx / total) * 100}%"></div></div>
        <span class="counter">${s.idx + 1} / ${total}</span>
      </div>

      <div class="study-card" id="card">
        <div class="word-block">
          <div class="the-word" style="font-size:${fs}px">${esc(w.term)}</div>
          ${w.phonetic ? `<div class="phonetic">${esc(w.phonetic)}</div>` : ''}
          <button class="speak-btn" id="speak" title="朗读">🔊</button>
        </div>

        <div class="reveal ${s.revealed ? 'show' : ''}" id="revealBox">
          <div class="meaning">${esc(w.meaning || '（暂无释义）')}</div>
          ${mates.length ? `
            <div class="mates">
              <span class="mates-label">同组一起记</span>
              ${mates.map(m => `<span class="chip">${esc(m.term)}</span>`).join('')}
            </div>` : ''}
        </div>

        ${s.revealed ? '' : '<div class="tap-hint" id="tapHint">轻触卡片，看看它的意思</div>'}
      </div>

      <div class="study-actions" id="actions">
        <button class="act-btn unknown" data-r="unknown">不认识</button>
        <button class="act-btn fuzzy" data-r="fuzzy">模糊</button>
        <button class="act-btn known" data-r="known">认识</button>
      </div>
    </div>`;

  main.querySelector('#exit').onclick = () => { 
    saveProgress(); // 退出时保存进度
    session = null; 
    state.view = 'home'; 
    render(); 
  };
  main.querySelector('#speak').onclick = e => { e.stopPropagation(); speak(w.term); };
  main.querySelector('#card').onclick = () => { if (!session.revealed) revealCard(); };
  
  // 统一定义评价按钮逻辑
  main.querySelectorAll('[data-r]').forEach(b => b.onclick = () => rate(b.dataset.r));
}

function revealCard(){
  if (!session || session.revealed) return;
  session.revealed = true;

  const box = document.getElementById('revealBox');
  if (box) box.classList.add('show');

  const hint = document.getElementById('tapHint');
  if (hint) hint.remove();
}

function rate(r){
  if (!session) return;
  const w = session.queue[session.idx];
  session.results[w.id] = r;

  // 如果还没看释义，并且点的是不认识或模糊，自动显示释义，暂不切下一个
  if (!session.revealed && (r === 'unknown' || r === 'fuzzy')) {
    revealCard();
    saveProgress();
    return;
  }

  // 其他情况（认识，或者已经显示了释义），直接切下一个
  session.idx++;
  session.revealed = false;
  saveProgress();

  if (session.idx >= session.queue.length) { finishStudy(); return; }
  render();
}

function finishStudy(){
  clearProgress(); // 完成学习，清除进度
  state.view = 'done';
  render();
}

/* ---------- 5.4 结果页 ---------- */
function renderDone(main){
  if (!session) { state.view = 'home'; render(); return; }

  const q = session.queue, r = session.results;
  const known   = q.filter(w => r[w.id] === 'known').length;
  const fuzzy   = q.filter(w => r[w.id] === 'fuzzy').length;
  const unknown = q.filter(w => r[w.id] === 'unknown').length;
  const wrongIds = q.filter(w => r[w.id] !== 'known').map(w => w.id);
  const listId = session.listId;

  main.innerHTML = `
    <div class="done">
      <div class="done-emoji">🌿</div>
      <h1>本轮完成！</h1>
      <div class="done-stats">
        <div class="stat known"><span>${known}</span>认识</div>
        <div class="stat fuzzy"><span>${fuzzy}</span>模糊</div>
        <div class="stat unknown"><span>${unknown}</span>不认识</div>
      </div>
      <div class="done-actions">
        ${wrongIds.length ? `<button class="btn primary" id="again">再背没掌握的（${wrongIds.length}）</button>` : ''}
        <button class="btn ghost" id="back">返回词表</button>
      </div>
    </div>`;

  const againBtn = main.querySelector('#again');
  if (againBtn) againBtn.onclick = () => startStudy(listId, wrongIds);
  main.querySelector('#back').onclick = () => { session = null; state.view = 'home'; render(); };
}

/* ============================================================
 *  6. 弹窗 & 上传
 * ============================================================ */
function openModal(html, onMount){
  const root = $('#modalRoot');
  root.innerHTML = `<div class="mask"><div class="modal">${html}</div></div>`;
  const mask = root.querySelector('.mask');
  mask.addEventListener('click', e => { if (e.target === mask) closeModal(); });
  if (onMount) onMount(root.querySelector('.modal'));
}
function closeModal(){ $('#modalRoot').innerHTML = ''; }

function openCreateModal(prefillName = '', prefillText = ''){
  openModal(`
    <h2>新建词表</h2>
    <p class="sub">每行一条，单词、词组、固定搭配都可以</p>

    <label class="field-label">词表名称</label>
    <input class="input" id="mName" placeholder="例如：考研核心词汇" value="${esc(prefillName)}">

    <label class="field-label">输入内容</label>
    <textarea class="input" id="mText" placeholder="abandon /əˈbændən/ 放弃；抛弃
look forward to 期待；盼望
give up, 放弃
in charge of 负责；掌管
take off 起飞；脱下">${esc(prefillText)}</textarea>

    <p class="hint">
      支持格式：<code>单词 释义</code> · <code>单词,释义</code> · <code>单词|音标|释义</code> · Tab 分隔 · <code>单词 /音标/ 释义</code>
    </p>

    <div class="modal-actions">
      <button class="btn ghost" id="mCancel">取消</button>
      <button class="btn primary" id="mOk">创建</button>
    </div>
  `, m => {
    m.querySelector('#mCancel').onclick = closeModal;
    m.querySelector('#mOk').onclick = () => {
      const name = m.querySelector('#mName').value.trim() || '未命名词表';
      const words = parseText(m.querySelector('#mText').value);
      if (!words.length) { alert('没有解析到内容，请检查格式～'); return; }
      createList(name, words);
      closeModal();
    };
  });
}

function createList(name, words){
  const list = {
    id: uid(),
    name,
    createdAt: Date.now(),
    words: words.map(w => ({ id: uid(), term: w.term, phonetic: w.phonetic || '', meaning: w.meaning || '' }))
  };
  LISTS.unshift(list);
  save();
  state.view = 'home';
  render();
  toast(`已创建「${name}」，共 ${words.length} 条内容`);
}

function pickFile(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.txt,.csv,.tsv,.md,text/plain';
  inp.onchange = () => {
    const f = inp.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = e => {
      const words = parseText(e.target.result || '');
      if (!words.length) { alert('文件里没有解析到内容，请检查格式～'); return; }
      const defaultName = f.name.replace(/\.[^.]+$/, '');
      openImportPreview(defaultName, words);
    };
    reader.readAsText(f, 'UTF-8');
  };
  inp.click();
}

function openImportPreview(name, words){
  const preview = words.slice(0, 20).map(w =>
    `<li><b>${esc(w.term)}</b>${w.phonetic ? `<span class="muted">${esc(w.phonetic)}</span>` : ''}<span class="muted">${esc(w.meaning)}</span></li>`
  ).join('');

  openModal(`
    <h2>导入预览</h2>
    <p class="sub">共解析到 <b>${words.length}</b> 条内容</p>

    <label class="field-label">词表名称</label>
    <input class="input" id="iName" value="${esc(name)}">

    <ul class="preview">${preview}</ul>
    ${words.length > 20 ? `<p class="hint">仅显示前 20 条…</p>` : ''}

    <div class="modal-actions">
      <button class="btn ghost" id="iCancel">取消</button>
      <button class="btn primary" id="iOk">导入</button>
    </div>
  `, m => {
    m.querySelector('#iCancel').onclick = closeModal;
    m.querySelector('#iOk').onclick = () => {
      const n = m.querySelector('#iName').value.trim() || '导入词表';
      createList(n, words);
      closeModal();
    };
  });
}

/* ============================================================
 *  7. 启动
 * ============================================================ */
document.getElementById('brand').onclick = () => { state.view = 'home'; render(); };
document.getElementById('navHome').onclick = () => { state.view = 'home'; render(); };

render();
</script>
</body>
